<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idea Graveyard</title>
<meta name="author" content="Sakshar Dhawan">
<meta name="description" content="Bury your abandoned ideas with an epitaph. Resurrect someone else's and build it.">
<meta name="theme-color" content="#06070b">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Idea Graveyard">
<meta property="og:title" content="Idea Graveyard">
<meta property="og:description" content="Bury your abandoned ideas with an epitaph. Resurrect someone else's and build it.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
<script type="module" src="/js/app.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="sky" aria-hidden="true">
  <div class="stars"></div>
  <div class="moon"></div>
  <div class="fog fog-a"></div>
  <div class="fog fog-b"></div>
  <div class="embers" id="embers"></div>
</div>

<header class="nav" id="nav">
  <a href="/" class="brand" data-link>
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M8 29V13a8 8 0 0 1 16 0v16z" /><path class="cross" d="M16 9v10M12 13h8" /></svg>
    <span>Idea Graveyard</span>
  </a>
  <nav class="nav-links" aria-label="Main">
    <a href="/" data-link data-nav="home">Graveyard</a>
    <a href="/leaderboard" data-link data-nav="leaderboard">Hall of Souls</a>
  </nav>
  <button class="search-trigger" id="searchBtn" aria-label="Search ideas">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span>Search the graves</span><kbd>/</kbd>
  </button>
  <div class="nav-actions" id="navActions"></div>
</header>

<div class="ticker" id="ticker" aria-live="polite" hidden><span class="ticker-dot"></span><span id="tickerText"></span></div>

<main id="main" tabindex="-1"></main>

<footer class="footer">
  <p>Built by <strong>Sakshar Dhawan</strong>. Every idea deserves a second life.</p>
  <p class="footer-keys"><kbd>/</kbd> search <kbd>B</kbd> bury an idea <kbd>Esc</kbd> close</p>
</footer>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="fx" id="fx" aria-hidden="true"></div>
</body>
</html>
